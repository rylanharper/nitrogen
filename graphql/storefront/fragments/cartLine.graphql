fragment CartLine on CartLine {
  attributes {
    key
    value
  }
  cost {
    subtotalAmount {
      ...Money
    }
    totalAmount {
      ...Money
    }
  }
  discountAllocations {
    discountedAmount {
      ...Money
    }
  }
  id
  merchandise {
    ... on ProductVariant {
      ...ProductVariant
    }
  }
  quantity
  sellingPlanAllocation {
    sellingPlan {
      name
    }
  }
}
